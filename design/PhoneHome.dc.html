<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Prata&display=swap">
  <style>
    body { margin: 0; background: #14120f; color: #f2ece0;
           font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
           -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #d4502e; text-decoration: none; }
    a:hover { color: #e8663f; }
    .lbl { font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase; color: #8a806f; font-weight: 600; }
    .cover { width: 44px; height: 60px; border-radius: 5px; flex-shrink: 0;
             background: linear-gradient(150deg, #2e2721, #1e1a15); border: 1px solid #332c25;
             display: grid; place-items: center; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14120f; display: flex; flex-direction: column; overflow: hidden">

  <!-- Шапка -->
  <div style="display: flex; align-items: center; gap: 9px; padding: 14px 18px; flex-shrink: 0">
    <svg width="20" height="20" viewBox="0 0 26 26" fill="none">
      <path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#f2ece0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M15.5 3.5V10H22" stroke="#f2ece0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M8 14.5h9M8 18h6" stroke="#d4502e" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span style="font-family: 'Prata', Georgia, serif; font-size: 16px">Толмач</span>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 8px; background: #1c1813; border: 1px solid #2c261f">
      <span style="font-size: 12.5px; font-weight: 600; color: #e4dbcb; font-variant-numeric: tabular-nums">73</span>
      <span style="font-size: 11.5px; color: #79726a">глав</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 12px 18px 0; flex-grow: 1; overflow: auto">

    <!-- Ввод ссылки -->
    <div style="display: flex; flex-direction: column; gap: 11px">
      <h1 style="font-family: 'Prata', Georgia, serif; font-size: 29px; font-weight: 400; line-height: 1.2; margin: 0 0 3px; color: #f8f3e9">Что читаем?</h1>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 15px; border-radius: 12px; background: #1c1813; border: 1px solid #2c261f">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0"><path d="M6.6 9.4a3 3 0 0 0 4.3 0l2.2-2.2a3 3 0 0 0-4.3-4.3l-.9.9" stroke="#5c5346" stroke-width="1.4" stroke-linecap="round"/><path d="M9.4 6.6a3 3 0 0 0-4.3 0L2.9 8.8a3 3 0 0 0 4.3 4.3l.9-.9" stroke="#5c5346" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span style="font-size: 15px; color: #5c5346">Ссылка на главу</span>
      </div>
      <button style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 52px; border-radius: 12px; background: #d4502e; border: none; color: #17130f; font-family: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer">
        Перевести и читать
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11m0 0-4-4m4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span style="font-size: 12px; color: #6b6459; text-align: center">Первые три абзаца — бесплатно и без входа</span>
    </div>

    <!-- Продолжить -->
    <div style="display: flex; flex-direction: column; gap: 11px">
      <span class="lbl">Продолжить</span>
      <button style="display: flex; align-items: center; gap: 13px; padding: 13px 14px; border-radius: 13px; background: #201b15; border: 1px solid #4a3527; cursor: pointer; font-family: inherit; text-align: left">
        <span class="cover" style="width: 50px; height: 68px">
          <svg width="18" height="18" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 14.5h9" stroke="#d4502e" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; color: #f2ece0; line-height: 1.3">Путь Пепельного Клинка</span>
          <span style="font-size: 12.5px; color: #8a806f">Глава 147 · остановились на трети</span>
          <span style="display: block; height: 4px; border-radius: 2px; background: #2c261f; margin-top: 3px">
            <span style="display: block; width: 34%; height: 100%; border-radius: 2px; background: #d4502e"></span>
          </span>
        </span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0"><path d="M6 3l5 5-5 5" stroke="#5c5346" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 8px; padding-left: 2px">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #7a9468"></span>
        <span style="font-size: 12px; color: #79726a">Глава 148 переведена заранее</span>
      </div>
    </div>

    <!-- Библиотека -->
    <div style="display: flex; flex-direction: column; gap: 11px; padding-bottom: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span class="lbl">Ваши книги</span>
        <span style="font-size: 12.5px; color: #79726a">4</span>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 2px">
        <span class="cover"><svg width="15" height="15" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; color: #e4dbcb; line-height: 1.3">Сорок седьмой контракт</span>
          <span style="font-size: 12px; color: #79726a">Глава 62 из 380 · литРПГ</span>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 2px">
        <span class="cover"><svg width="15" height="15" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; color: #e4dbcb; line-height: 1.3">Дом, который считает гостей</span>
          <span style="font-size: 12px; color: #79726a">Глава 9 из 96 · мистика</span>
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 2px">
        <span class="cover"><svg width="15" height="15" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; color: #e4dbcb; line-height: 1.3">Тихая жатва</span>
          <span style="font-size: 12px; color: #79726a">Дочитано · 214 глав</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div style="display: flex; padding: 8px 10px 22px; border-top: 1px solid #221d17; background: #17140f; flex-shrink: 0">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#d4502e" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 14.5h9M8 18h6" stroke="#d4502e" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #d4502e; font-weight: 600">Читать</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><path d="M5 5h5v16H5zM12 5h4v16h-4zM18.5 5.8l3.4 15.6" stroke="#6b6459" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Книги</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><circle cx="12" cy="12" r="7.5" stroke="#6b6459" stroke-width="1.8"/><path d="m17.5 17.5 4 4" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Каталог</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="4" stroke="#6b6459" stroke-width="1.8"/><path d="M5 22c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Я</span>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
