<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:ital,wght@0,400&family=Prata&display=swap">
  <style>
    body { margin: 0; background: #14120f; color: #f2ece0;
           font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
           -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #d4502e; text-decoration: none; }
    a:hover { color: #e8663f; }
    .tag { font-size: 10.5px; padding: 3px 8px; border-radius: 5px; background: #221d17; color: #a49a89; white-space: nowrap; }
    .chip { height: 34px; padding: 0 14px; border-radius: 9px; background: #1c1813; border: 1px solid #262019;
            color: #8a806f; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .cv { width: 56px; height: 78px; border-radius: 6px; flex-shrink: 0;
          background: linear-gradient(150deg, #2e2721, #1c1813); border: 1px solid #332c25;
          display: grid; place-items: center; }
    .en { font-family: 'Literata', Georgia, serif; font-style: italic; color: #79848c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #14120f; display: flex; flex-direction: column; overflow: hidden">

  <!-- Шапка -->
  <div style="display: flex; align-items: center; gap: 9px; padding: 14px 18px 10px; flex-shrink: 0">
    <svg width="20" height="20" viewBox="0 0 26 26" fill="none">
      <path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#f2ece0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M15.5 3.5V10H22" stroke="#f2ece0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M8 14.5h9M8 18h6" stroke="#d4502e" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span style="font-family: 'Prata', Georgia, serif; font-size: 16px">Каталог</span>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 12.5px; color: #79726a">312 книг</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 18px; flex-grow: 1; overflow: auto">

    <div style="display: flex; align-items: center; gap: 11px; height: 48px; padding: 0 15px; border-radius: 12px; background: #1c1813; border: 1px solid #2c261f; flex-shrink: 0">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="#5c5346" stroke-width="1.5"/><path d="m10.6 10.6 3 3" stroke="#5c5346" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span style="font-size: 14.5px; color: #5c5346">Название или автор</span>
    </div>

    <!-- Фильтры лентой -->
    <div style="display: flex; gap: 7px; overflow: hidden; flex-shrink: 0">
      <button class="chip" style="background: #2a2119; border-color: #d4502e; color: #f2ece0; font-weight: 600">Все</button>
      <button class="chip">Сянься</button>
      <button class="chip">ЛитРПГ</button>
      <button class="chip">Прогрессия</button>
      <button class="chip">Уся</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px">

      <button style="display: flex; gap: 13px; padding: 13px; border-radius: 12px; background: #1a1611; border: 1px solid #262019; cursor: pointer; font-family: inherit; text-align: left">
        <span class="cv"><svg width="18" height="18" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 14.5h9" stroke="#d4502e" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; color: #f2ece0; line-height: 1.3">Путь Пепельного Клинка</span>
          <span class="en" style="font-size: 11.5px">The Ashen Blade Path</span>
          <span style="font-size: 11.5px; color: #79726a">1 204 главы · выходит</span>
          <span style="display: flex; gap: 5px; margin-top: 2px">
            <span class="tag">сянься</span><span class="tag">культивация</span>
            <span style="margin-left: auto; font-size: 11px; color: #e08160; font-weight: 500">142 термина</span>
          </span>
        </span>
      </button>

      <button style="display: flex; gap: 13px; padding: 13px; border-radius: 12px; background: #1a1611; border: 1px solid #262019; cursor: pointer; font-family: inherit; text-align: left">
        <span class="cv"><svg width="18" height="18" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; color: #f2ece0; line-height: 1.3">Сорок седьмой контракт</span>
          <span class="en" style="font-size: 11.5px">The Forty-Seventh Contract</span>
          <span style="font-size: 11.5px; color: #79726a">380 глав · выходит</span>
          <span style="display: flex; gap: 5px; margin-top: 2px">
            <span class="tag">литРПГ</span><span class="tag">юмор</span>
            <span style="margin-left: auto; font-size: 11px; color: #e08160; font-weight: 500">96 терминов</span>
          </span>
        </span>
      </button>

      <button style="display: flex; gap: 13px; padding: 13px; border-radius: 12px; background: #1a1611; border: 1px solid #262019; cursor: pointer; font-family: inherit; text-align: left">
        <span class="cv"><svg width="18" height="18" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; color: #f2ece0; line-height: 1.3">Лестница в девять пролётов</span>
          <span class="en" style="font-size: 11.5px">Nine Flights Up</span>
          <span style="font-size: 11.5px; color: #79726a">640 глав · выходит</span>
          <span style="display: flex; gap: 5px; margin-top: 2px">
            <span class="tag">прогрессия</span><span class="tag">башня</span>
            <span style="margin-left: auto; font-size: 11px; color: #e08160; font-weight: 500">88 терминов</span>
          </span>
        </span>
      </button>

      <button style="display: flex; gap: 13px; padding: 13px; border-radius: 12px; background: #1a1611; border: 1px solid #262019; cursor: pointer; font-family: inherit; text-align: left">
        <span class="cv"><svg width="18" height="18" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#4d4437" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; color: #f2ece0; line-height: 1.3">Тихая жатва</span>
          <span class="en" style="font-size: 11.5px">The Quiet Harvest</span>
          <span style="font-size: 11.5px; color: #79726a">214 глав · завершена</span>
          <span style="display: flex; gap: 5px; margin-top: 2px">
            <span class="tag">постапокалипсис</span>
            <span style="margin-left: auto; font-size: 11px; color: #e08160; font-weight: 500">64 термина</span>
          </span>
        </span>
      </button>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div style="display: flex; padding: 8px 10px 22px; border-top: 1px solid #221d17; background: #17140f; flex-shrink: 0">
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><path d="M4 3.5h11.5L22 10v12.5H4z" stroke="#6b6459" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 14.5h9M8 18h6" stroke="#6b6459" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Читать</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><path d="M5 5h5v16H5zM12 5h4v16h-4zM18.5 5.8l3.4 15.6" stroke="#6b6459" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Книги</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><circle cx="12" cy="12" r="7.5" stroke="#d4502e" stroke-width="1.8"/><path d="m17.5 17.5 4 4" stroke="#d4502e" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #d4502e; font-weight: 600">Каталог</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-grow: 1; height: 50px; background: transparent; border: none; cursor: pointer; font-family: inherit">
      <svg width="21" height="21" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9" r="4" stroke="#6b6459" stroke-width="1.8"/><path d="M5 22c0-3.9 3.6-6.5 8-6.5s8 2.6 8 6.5" stroke="#6b6459" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size: 10.5px; color: #6b6459">Я</span>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
